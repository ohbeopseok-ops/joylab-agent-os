[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "joylab-agent-os"
version = "0.4.2"
requires-python = ">=3.11"
description = "Governed learning core for JoyLab Personal Agent OS"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
